name: Weekly PMing Curation

on:
  schedule:
    # Every Sunday at 00:00 UTC
    - cron: '0 0 * * 0'
  workflow_dispatch: # Allow manual trigger

permissions:
  contents: write

jobs:
  curate-and-publish:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout src branch
        uses: actions/checkout@v4
        with:
          ref: src
          submodules: true
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install dependencies
        working-directory: scripts
        run: npm install

      - name: Run PMing curation script
        run: node scripts/generate_pming.js

      - name: Check for new post
        id: check
        run: |
          if [ -z "$(git status --porcelain)" ]; then
            echo "No new files generated."
            echo "has_changes=false" >> $GITHUB_OUTPUT
          else
            echo "New post detected."
            echo "has_changes=true" >> $GITHUB_OUTPUT
          fi

      - name: Commit and push new post
        if: steps.check.outputs.has_changes == 'true'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add content/posts/*-weekly-pming.md
          git commit -m "📰 Weekly PMing curation - $(date +'%Y-%m-%d')"
          git push origin src
